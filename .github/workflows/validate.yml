name: Validate Ente desktop release
run-name: Ente ${{ inputs.release }} validation ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      release:
        description: Ente stable or nightly release URL or tag
        required: true
        default: v1.7.28
      baseline:
        description: Override baseline URL/tag (nightlies default to the archived 2026-09-08 build)
        required: false
      request_id:
        description: Optional CLI correlation ID
        required: false
      scenarios:
        description: Optional comma-separated scenario IDs for debugging (cannot grant full coverage)
        required: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository_owner != 'ente' && github.repository_owner != 'ente-io'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test && npm run check
      - id: plan
        run: node scripts/prepare-workflow.js
        env:
          RELEASE: ${{ inputs.release }}
          BASELINE: ${{ inputs.baseline }}
          SCENARIOS: ${{ inputs.scenarios }}
          GH_TOKEN: ${{ secrets.ENTE_RELEASE_READ_TOKEN || github.token }}
          BASELINE_READ_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: validation-plan
          path: reports/plan
          if-no-files-found: warn

  validate:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ secrets.ENTE_RELEASE_READ_TOKEN || github.token }}
      BASELINE_READ_TOKEN: ${{ github.token }}
      SCENARIO: ${{ matrix.id }}
      CONTAINER_DISTRO: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validation-plan
          path: reports/plan
      - run: npm ci --ignore-scripts
      - name: Prepare hosted Ubuntu desktop dependencies
        if: runner.os == 'Linux' && runner.environment == 'github-hosted' && matrix.container == ''
        run: sudo apt-get update && sudo apt-get install -y xvfb imagemagick nftables libfuse2t64 libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2t64 libgbm1
      - name: Enable Chromium namespace sandbox on disposable Ubuntu
        if: runner.os == 'Linux' && runner.environment == 'github-hosted' && matrix.container == ''
        shell: bash
        run: |
          mkdir -p "reports/scenarios/$SCENARIO/artifacts"
          sysctl -n kernel.apparmor_restrict_unprivileged_userns > "reports/scenarios/$SCENARIO/artifacts/host-userns-policy.txt"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user true
      - name: Validate Fedora or Arch in a disposable container
        if: matrix.container != ''
        shell: bash
        run: bash scripts/run-container.sh
      - name: Validate one disposable scenario
        if: matrix.container == ''
        shell: bash
        run: |
          args=(node src/cli.js run --plan reports/plan/plan.json --scenario "$SCENARIO" --out "reports/scenarios/$SCENARIO" --disposable)
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a "${args[@]}"
          else
            "${args[@]}"
          fi
      - name: Restore OS firewall after failure or cancellation
        if: always() && matrix.container == ''
        shell: bash
        run: node src/cli.js network-restore --out "reports/scenarios/$SCENARIO"
      - name: Restore Ubuntu namespace policy after failure or cancellation
        if: always() && runner.os == 'Linux' && runner.environment == 'github-hosted' && matrix.container == ''
        shell: bash
        run: |
          policy="reports/scenarios/$SCENARIO/artifacts/host-userns-policy.txt"
          if [[ -s "$policy" ]]; then
            sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$(cat "$policy")"
          fi
      - name: Destroy scenario container after failure or cancellation
        if: always() && matrix.container != ''
        shell: bash
        run: docker rm -f "ente-validator-$SCENARIO" || true
      - name: Preserve check results in the job summary
        if: always()
        shell: bash
        run: |
          summary="reports/scenarios/$SCENARIO/summary.md"
          if [[ -f "$summary" ]]; then
            cat "$summary"
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Scenario $SCENARIO did not produce a complete report." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scenario-${{ matrix.id }}
          path: |
            reports/scenarios/${{ matrix.id }}/report.json
            reports/scenarios/${{ matrix.id }}/progress.json
            reports/scenarios/${{ matrix.id }}/summary.md
            reports/scenarios/${{ matrix.id }}/artifacts
            reports/scenarios/${{ matrix.id }}/network/probes-*.json
          if-no-files-found: warn
          retention-days: 14

  report:
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validation-plan
          path: reports/plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: scenario-*
          path: reports/scenarios
      - run: mkdir -p reports/scenarios
      - run: node src/cli.js aggregate --plan reports/plan/plan.json --reports reports/scenarios --out reports/final
        env:
          GH_TOKEN: ${{ secrets.ENTE_RELEASE_READ_TOKEN || github.token }}
          BASELINE_READ_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-readiness-report
          path: reports/final
