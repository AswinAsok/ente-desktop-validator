name: Test validator
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - name: Validate Linux firewall syntax without applying rules
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y nftables
          node --input-type=module -e 'import {linuxRules} from "./src/network.js"; import fs from "node:fs"; fs.writeFileSync("/tmp/ente-validator-rules.nft",linuxRules(["192.0.2.1","2001:db8::1"],"online"));'
          sudo nft --check --file /tmp/ente-validator-rules.nft
